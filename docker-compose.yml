# Optional: Postgres (TimescaleDB) + Redis for when SQLite is outgrown.
#   docker compose up -d
#   set TDP_DATABASE_URL=postgresql+psycopg://traderdesk:traderdesk@127.0.0.1:5432/traderdesk
#   pip install -e "backend[postgres]"
# Ports bind to 127.0.0.1 only.
services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: traderdesk
      POSTGRES_PASSWORD: traderdesk
      POSTGRES_DB: traderdesk
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
volumes:
  pgdata:
